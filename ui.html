<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 12px/1.4 Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--figma-color-text, #333);
    background: var(--figma-color-bg, #fff);
  }
  .controls {
    position: sticky; top: 0; z-index: 1;
    padding: 12px;
    background: var(--figma-color-bg, #fff);
    border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
    display: grid; gap: 8px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, input[type=search] {
    flex: 1; min-width: 0; height: 28px; padding: 0 8px;
    font: inherit; color: inherit;
    background: var(--figma-color-bg, #fff);
    border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 4px;
  }
  button {
    height: 28px; padding: 0 12px; font: inherit; font-weight: 500;
    border: 0; border-radius: 4px; cursor: pointer;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #fff);
  }
  button.secondary {
    background: transparent; color: inherit;
    border: 1px solid var(--figma-color-border, #e5e5e5);
  }
  button:disabled { opacity: .5; cursor: default; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .summary { color: var(--figma-color-text-secondary, #666); }
  .error { color: var(--figma-color-text-danger, #f24822); }
  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
  }
  .head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  .head:hover, .variant:hover { background: var(--figma-color-bg-hover, #f5f5f5); }
  .toggle {
    width: 16px; flex: none; text-align: center;
    color: var(--figma-color-icon-secondary, #999);
    user-select: none;
  }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .badge {
    flex: none; font-size: 10px; padding: 1px 6px; border-radius: 8px;
    background: var(--figma-color-bg-secondary, #f0f0f0);
    color: var(--figma-color-text-secondary, #666);
  }
  .badge.library { background: var(--figma-color-bg-component-tertiary, #f1e6ff); color: var(--figma-color-text-component, #9747ff); }
  .badge.missing { background: var(--figma-color-bg-danger-tertiary, #ffe2e0); color: var(--figma-color-text-danger, #f24822); }
  .count { flex: none; min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; color: var(--figma-color-text-secondary, #666); }
  .variants { display: none; padding-bottom: 4px; }
  .item.open .variants { display: block; }
  .variant {
    display: flex; gap: 8px; padding: 4px 12px 4px 36px; cursor: pointer;
    color: var(--figma-color-text-secondary, #666);
  }
  .variant .name { font-weight: 400; }
  .resize {
    position: fixed; right: 0; bottom: 0; z-index: 2;
    width: 16px; height: 16px; cursor: nwse-resize;
    color: var(--figma-color-icon-tertiary, #b3b3b3);
  }
  .empty { padding: 24px 12px; text-align: center; color: var(--figma-color-text-secondary, #666); }
</style>

<div class="controls">
  <div class="row">
    <select id="page"></select>
    <button id="scan">Scan</button>
  </div>
  <div class="row">
    <label><input type="checkbox" id="nested" /> Include nested instances</label>
    <label><input type="checkbox" id="libraryOnly" /> Library only</label>
  </div>
  <div class="row">
    <input type="search" id="filter" placeholder="Filter components…" />
    <button id="copy" class="secondary" disabled>Copy</button>
  </div>
  <div id="status" class="summary">Pick a page and press Scan.</div>
</div>

<ul id="list"></ul>

<svg class="resize" id="resize" viewBox="0 0 16 16" aria-label="Resize window">
  <path d="M15 6 6 15M15 10l-5 5M15 14l-1 1" stroke="currentColor" stroke-width="1.2" fill="none" />
</svg>

<script>
  const $ = (id) => document.getElementById(id);
  const pageSel = $('page'), scanBtn = $('scan'), nested = $('nested'), libraryOnly = $('libraryOnly');
  const filter = $('filter'), copyBtn = $('copy'), statusEl = $('status'), list = $('list');

  let result = null;
  let pagesLoaded = false;

  const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'error' : 'summary';
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function badge(c) {
    if (c.kind === 'missing') return '<span class="badge missing">Missing</span>';
    return c.remote ? '<span class="badge library">Library</span>' : '<span class="badge">Local</span>';
  }

  // Components matching the Library-only switch (ignores the text filter).
  function scoped() {
    return libraryOnly.checked ? result.components.filter((c) => c.remote) : result.components;
  }

  function updateSummary() {
    const comps = scoped();
    const n = comps.length;
    const inst = comps.reduce((sum, c) => sum + c.count, 0);
    const what = libraryOnly.checked ? 'library component' : 'component';
    setStatus(`${n} ${what}${n === 1 ? '' : 's'} · ${inst} instance${inst === 1 ? '' : 's'} on "${result.pageName}"`);
    copyBtn.disabled = !n;
  }

  function render() {
    if (!result) return;
    const q = filter.value.trim().toLowerCase();
    const items = scoped().filter((c) =>
      !q || c.name.toLowerCase().includes(q) || c.variants.some((v) => v.name.toLowerCase().includes(q))
    );

    if (!items.length) {
      const empty = result.components.length === 0 ? 'No components on this page.'
        : scoped().length === 0 ? 'No library components on this page.'
        : 'No matches.';
      list.innerHTML = `<li class="empty">${empty}</li>`;
      return;
    }

    list.innerHTML = items.map((c, i) => `
      <li class="item" data-i="${result.components.indexOf(c)}">
        <div class="head" title="Click to select all instances">
          <span class="toggle">${c.variants.length ? '▸' : ''}</span>
          <span class="name">${esc(c.name)}</span>
          ${badge(c)}
          <span class="count">${c.count}</span>
        </div>
        ${c.variants.length ? `<div class="variants">${c.variants.map((v, j) => `
          <div class="variant" data-j="${j}" title="Click to select these instances">
            <span class="name">${esc(v.name)}</span>
            <span class="count">${v.count}</span>
          </div>`).join('')}</div>` : ''}
      </li>`).join('');
  }

  list.addEventListener('click', (e) => {
    const item = e.target.closest('.item');
    if (!item) return;
    const c = result.components[+item.dataset.i];

    if (e.target.closest('.toggle') && c.variants.length) {
      item.classList.toggle('open');
      item.querySelector('.toggle').textContent = item.classList.contains('open') ? '▾' : '▸';
      return;
    }
    const variant = e.target.closest('.variant');
    const ids = variant ? c.variants[+variant.dataset.j].ids : c.instanceIds;
    post({ type: 'select', pageId: result.pageId, ids });
  });

  scanBtn.onclick = () => {
    scanBtn.disabled = true;
    setStatus('Scanning…');
    post({ type: 'scan', pageId: pageSel.value, includeNested: nested.checked });
  };

  filter.oninput = render;

  libraryOnly.onchange = () => {
    if (!result) return;
    updateSummary();
    render();
  };

  copyBtn.onclick = () => {
    if (!result) return;
    const lines = [`${libraryOnly.checked ? 'Library components' : 'Components'} on "${result.pageName}"`, ''];
    for (const c of scoped()) {
      lines.push(`${c.name} (${c.kind === 'missing' ? 'missing' : c.remote ? 'library' : 'local'}) — ${c.count}`);
      for (const v of c.variants) lines.push(`    ${v.name} — ${v.count}`);
    }
    const ta = document.createElement('textarea');
    ta.value = lines.join('\n');
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    setStatus('Copied to clipboard.');
  };

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'pages') {
      const prev = pageSel.value;
      const current = msg.pages.find((p) => p.id === msg.currentPageId);
      pageSel.innerHTML =
        `<option value="__current__">Current page${current ? ` (${esc(current.name)})` : ''}</option>` +
        msg.pages.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
      pageSel.value = pagesLoaded && msg.pages.some((p) => p.id === prev) ? prev : '__current__';
      pagesLoaded = true;
      // On "Current page", a result from another page is stale: clear it.
      if (result && pageSel.value === '__current__' && result.pageId !== msg.currentPageId) {
        result = null;
        list.innerHTML = '';
        filter.value = '';
        copyBtn.disabled = true;
        setStatus('Press Scan to scan this page.');
      }
    } else if (msg.type === 'progress') {
      setStatus(`Scanning… ${msg.done} / ${msg.total}`);
    } else if (msg.type === 'result') {
      result = msg;
      scanBtn.disabled = false;
      updateSummary();
      render();
    } else if (msg.type === 'error') {
      scanBtn.disabled = false;
      setStatus(msg.message, true);
    }
  };

  const grip = $('resize');
  grip.onpointerdown = (e) => {
    grip.setPointerCapture(e.pointerId);
    grip.onpointermove = (ev) => post({
      type: 'resize',
      width: Math.max(320, Math.round(ev.clientX + 8)),
      height: Math.max(300, Math.round(ev.clientY + 8)),
    });
  };
  grip.onpointerup = (e) => {
    grip.releasePointerCapture(e.pointerId);
    grip.onpointermove = null;
  };

  post({ type: 'ready' });
</script>
